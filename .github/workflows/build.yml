name: macOS build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build native app and installer
        run: make build
      - name: Validate file safety and merge engine
        run: |
          swiftc Sources/Lumen/AssociationPolicy.swift scripts/test_associations.swift -o work/test-associations
          work/test-associations
          swiftc Sources/LumenCore/ExternalMerge.swift scripts/test_external_merge.swift -o work/test-merge
          work/test-merge
          swiftc Sources/Lumen/RemoteWorkspace.swift scripts/test_remote.swift -o work/test-remote
          work/test-remote
      - uses: actions/upload-artifact@v4
        with:
          name: Orkhon-Code-macOS
          path: outputs/Orkhon Code Installer.pkg

  linux-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify native Linux events and burst handling
        run: |
          python3 scripts/test_workspace_watch.py
          python3 scripts/stress_workspace_watch.py
